name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: node scripts/check-migration-prefixes.mjs
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
      - run: go build ./cmd/api
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build
      - run: npm run check:bundle-budget

  database-security:
    name: Supabase migrations and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start only Postgres and apply migrations
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: supabase db start
      - name: Run Supabase database tests
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: supabase test db
      - name: Configure Go for realtime integration test
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Test realtime fanout between independent API instances
        working-directory: backend
        env:
          REALTIME_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable
        run: go test ./internal/realtime -run '^TestPostgresBrokerFanoutAcrossIndependentInstances$' -count=1
      - name: Test broker readiness while disconnected and after reconnection
        working-directory: backend
        env:
          REALTIME_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres?sslmode=disable
        run: go test ./internal/realtime -run '^TestPostgresBrokerReadinessReconnects$' -count=1
      - if: always()
        run: supabase stop --no-backup
  e2e:
    name: E2E authenticated (optional)
    outputs:
      e2e_status: ${{ steps.configure-auth-state.outputs.result == 'skipped' && 'skipped' || steps.run-e2e.outcome }}
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://maismorras.vercel.app' }}
      E2E_API_BASE: ${{ vars.E2E_API_BASE || 'https://maismorras-api-454646414754.southamerica-east1.run.app' }}
      E2E_STORAGE_STATE_B64: ${{ secrets.E2E_STORAGE_STATE_B64 }}
      E2E_SCENE_URL: ${{ vars.E2E_SCENE_URL }}
      E2E_PLAYER_STORAGE_STATE_B64: ${{ secrets.E2E_PLAYER_STORAGE_STATE_B64 }}
      E2E_SUPABASE_URL: ${{ vars.E2E_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_GM_EMAIL: ${{ secrets.E2E_GM_EMAIL }}
      E2E_GM_PASSWORD: ${{ secrets.E2E_GM_PASSWORD }}
      E2E_PLAYER_EMAIL: ${{ secrets.E2E_PLAYER_EMAIL }}
      E2E_PLAYER_PASSWORD: ${{ secrets.E2E_PLAYER_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Configure authenticated storage state
        id: configure-auth-state
        shell: pwsh
        working-directory: frontend
        run: |
          $loginValues = @($env:E2E_SUPABASE_URL, $env:E2E_SUPABASE_PUBLISHABLE_KEY, $env:E2E_GM_EMAIL, $env:E2E_GM_PASSWORD, $env:E2E_PLAYER_EMAIL, $env:E2E_PLAYER_PASSWORD)
          $loginCount = @($loginValues | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($loginCount -eq $loginValues.Count) {
            node e2e/create-auth-state.mjs
            "E2E_STORAGE_STATE=$(Join-Path (Get-Location) 'e2e-storage-state.json')" | Out-File $env:GITHUB_ENV -Append
            "E2E_PLAYER_STORAGE_STATE=$(Join-Path (Get-Location) 'e2e-player-storage-state.json')" | Out-File $env:GITHUB_ENV -Append
            "result=configured" >> $env:GITHUB_OUTPUT
          } elseif ($loginCount -gt 0) {
            throw 'Configure all six E2E login variables together, or use the legacy storage-state secrets temporarily.'
          } elseif (-not [string]::IsNullOrWhiteSpace($env:E2E_STORAGE_STATE_B64)) {
            [IO.File]::WriteAllBytes('e2e-storage-state.json', [Convert]::FromBase64String($env:E2E_STORAGE_STATE_B64))
            "E2E_STORAGE_STATE=$(Join-Path (Get-Location) 'e2e-storage-state.json')" | Out-File $env:GITHUB_ENV -Append
            if (-not [string]::IsNullOrWhiteSpace($env:E2E_PLAYER_STORAGE_STATE_B64)) {
              [IO.File]::WriteAllBytes('e2e-player-storage-state.json', [Convert]::FromBase64String($env:E2E_PLAYER_STORAGE_STATE_B64))
              "E2E_PLAYER_STORAGE_STATE=$(Join-Path (Get-Location) 'e2e-player-storage-state.json')" | Out-File $env:GITHUB_ENV -Append
            }
            "result=configured" >> $env:GITHUB_OUTPUT
            Write-Warning 'Using legacy static browser state; configure E2E login credentials to remove manual refreshes.'
          } else {
            "No E2E accounts configured; skipping authenticated E2E." | Out-File e2e-skip.txt
            "result=skipped" >> $env:GITHUB_OUTPUT
            exit 0
          }
      - name: Run Playwright E2E
        id: run-e2e
        shell: pwsh
        working-directory: frontend
        run: |
          if (Test-Path e2e-skip.txt) { Write-Host 'Authenticated E2E skipped.'; exit 0 }
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Remove session state
        if: always()
        shell: pwsh
        working-directory: frontend
        run: Remove-Item -Force -ErrorAction SilentlyContinue e2e-storage-state.json, e2e-player-storage-state.json
      - name: Report authenticated E2E status
        if: always()
        shell: pwsh
        env:
          E2E_CONFIGURED: ${{ steps.configure-auth-state.outputs.result }}
          E2E_OUTCOME: ${{ steps.run-e2e.outcome }}
        run: |
          if ($env:E2E_CONFIGURED -eq 'skipped') {
            "### Authenticated E2E: SKIPPED`n`nNo automated E2E login credentials or legacy storage-state secret were configured; no authenticated browser tests ran." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "### Authenticated E2E: $($env:E2E_OUTCOME.ToUpperInvariant())" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
  local-authenticated-e2e:
    name: Mandatory local authenticated E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start isolated local Supabase stack and apply migrations
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        shell: bash
        run: |
          set +x
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1 || {
            echo '::error::Local Supabase failed to start; output was suppressed to protect generated credentials.'
            exit 1
          }
      - name: Configure local service credentials without printing them
        shell: pwsh
        run: |
          $status = supabase status -o env
          if ($LASTEXITCODE -ne 0) { throw 'Could not read local Supabase runtime settings.' }
          $values = @{}
          foreach ($line in $status) {
            if ($line -match '^([A-Z0-9_]+)="?(.*?)"?$') { $values[$matches[1]] = $matches[2].Trim('"') }
          }
          foreach ($required in @('API_URL', 'ANON_KEY', 'SERVICE_ROLE_KEY', 'JWT_SECRET', 'DB_URL')) {
            if ([string]::IsNullOrWhiteSpace($values[$required])) { throw "Local Supabase did not provide $required." }
          }
          foreach ($secretName in @('ANON_KEY', 'PUBLISHABLE_KEY', 'SECRET_KEY', 'SERVICE_ROLE_KEY', 'JWT_SECRET', 'DB_URL')) {
            Write-Output "::add-mask::$($values[$secretName])"
          }
          @(
            "LOCAL_SUPABASE_URL=$($values['API_URL'])",
            "SUPABASE_URL=$($values['API_URL'])",
            "PUBLIC_SUPABASE_URL=$($values['API_URL'])",
            "PUBLIC_SUPABASE_PUBLISHABLE_KEY=$($values['ANON_KEY'])",
            "SUPABASE_SERVICE_ROLE_KEY=$($values['SERVICE_ROLE_KEY'])",
            "SUPABASE_JWT_SECRET=$($values['JWT_SECRET'])",
            "DATABASE_URL=$($values['DB_URL'])",
            'REALTIME_BROKER=local',
            'PORT=8080',
            'CORS_ORIGIN=http://127.0.0.1:4173',
            'PUBLIC_API_BASE_URL=http://127.0.0.1:8080',
            'PUBLIC_E2E_AUTH=true',
            'LOCAL_AUTH_E2E=true',
            'E2E_LOCAL_STACK=true'
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install frontend dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start local apps, run authenticated E2E, and always stop apps
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $backend = $null
          $frontend = $null
          try {
            $apiBinary = Join-Path (Get-Location).Path 'artifacts/maismorras-api'
            Push-Location backend
            try {
              go build -o $apiBinary ./cmd/api
              if ($LASTEXITCODE -ne 0) { throw 'Local API build failed.' }
            } finally { Pop-Location }

            $backend = Start-Process -FilePath $apiBinary -WorkingDirectory (Join-Path (Get-Location).Path 'backend') -RedirectStandardOutput (Join-Path (Get-Location).Path 'artifacts/backend.log') -RedirectStandardError (Join-Path (Get-Location).Path 'artifacts/backend-error.log') -PassThru
            $frontend = Start-Process -FilePath 'node' -ArgumentList @('node_modules/vite/bin/vite.js', 'dev', '--host', '127.0.0.1', '--port', '4173') -WorkingDirectory (Join-Path (Get-Location).Path 'frontend') -RedirectStandardOutput (Join-Path (Get-Location).Path 'artifacts/frontend.log') -RedirectStandardError (Join-Path (Get-Location).Path 'artifacts/frontend-error.log') -PassThru

            $deadline = (Get-Date).AddMinutes(3)
            do {
              Start-Sleep -Seconds 2
              try { $ready = Invoke-RestMethod 'http://127.0.0.1:8080/health/ready'; $backendReady = $ready.status -eq 'ok' } catch { $backendReady = $false }
              try { $frontendReady = (Invoke-WebRequest 'http://127.0.0.1:4173' -UseBasicParsing).StatusCode -eq 200 } catch { $frontendReady = $false }
              if ($backendReady -and $frontendReady) { break }
              if ($backend.HasExited -or $frontend.HasExited) { throw 'A local app process exited before becoming ready.' }
              if ((Get-Date) -gt $deadline) { throw 'Local API or frontend did not become ready; inspect sanitized artifacts.' }
            } while ($true)

            Push-Location frontend
            try {
              npx playwright test e2e/local-authenticated.spec.ts e2e/local-authenticated-audio.spec.ts e2e/local-authenticated-map-sheet.spec.ts --project=chromium --workers=1
              if ($LASTEXITCODE -ne 0) { throw 'Mandatory authenticated E2E failed.' }
            } finally { Pop-Location }
          } finally {
            foreach ($process in @($frontend, $backend)) {
              if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            }
          }
      - name: Sanitize local E2E diagnostics
        if: always()
        shell: pwsh
        run: |
          $diagnosticRoots = @(
            (Join-Path $env:GITHUB_WORKSPACE 'artifacts'),
            (Join-Path $env:GITHUB_WORKSPACE 'frontend/test-results'),
            (Join-Path $env:GITHUB_WORKSPACE 'frontend/playwright-report')
          )
          $textExtensions = @('.log', '.txt', '.json', '.html', '.xml', '.md', '.trace', '.snapshot', '.js', '.css')
          $sensitiveValue = '(?i)(["'']?(?:access[_-]?token|refresh[_-]?token|service[_-]?role[_-]?key|secret[_-]?key|publishable[_-]?key|api[_-]?key|jwt[_-]?secret|database[_-]?url|password|authorization)["'']?\s*[:=]\s*["'']?)[^"'',}\s]+'
          $headerValue = '(?i)(["'']name["'']\s*:\s*["''](?:authorization|apikey|x-api-key)["'']\s*,\s*["'']value["'']\s*:\s*["''])(?:Bearer\s+)?[^"'']*'
          $jwt = '\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{8,}\b'
          $bearer = '(?i)(Bearer\s+)[A-Za-z0-9._~+/-]+=*'
          $signedQuery = '(?i)([?&](?:token|signature|sig|x-amz-signature|x-amz-credential)=)[^&"''\s]+'
          $supabaseKey = '\bsb_(?:secret|publishable)_[A-Za-z0-9_-]+'
          $testPassword = 'Local-[A-Za-z0-9_-]{20,}-9!'
          $testEmail = '\b(?:gm|player)-[a-f0-9]{16}@example\.test\b'
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          foreach ($root in $diagnosticRoots) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            foreach ($file in Get-ChildItem -LiteralPath $root -File -Recurse) {
              if ($file.Extension -notin $textExtensions) { continue }
              $content = [IO.File]::ReadAllText($file.FullName)
              $content = [regex]::Replace($content, $sensitiveValue, '$1[REDACTED]')
              $content = [regex]::Replace($content, $headerValue, '$1[REDACTED]')
              $content = [regex]::Replace($content, $jwt, '[REDACTED_JWT]')
              $content = [regex]::Replace($content, $bearer, '$1[REDACTED]')
              $content = [regex]::Replace($content, $signedQuery, '$1[REDACTED]')
              $content = [regex]::Replace($content, $supabaseKey, '[REDACTED_SUPABASE_KEY]')
              $content = [regex]::Replace($content, $testPassword, '[TEMP_TEST_PASSWORD]')
              $content = [regex]::Replace($content, $testEmail, '[TEMP_TEST_USER]')
              [IO.File]::WriteAllText($file.FullName, $content, $utf8)
            }
          }
          # Traces and network captures can contain credentials in arbitrary internal files.
          # Exclude them wholesale; diagnostics retain sanitized text and non-network visual failures.
          foreach ($root in @(
            (Join-Path $env:GITHUB_WORKSPACE 'frontend/test-results'),
            (Join-Path $env:GITHUB_WORKSPACE 'frontend/playwright-report')
          )) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            foreach ($file in Get-ChildItem -LiteralPath $root -File -Recurse) {
              if ($file.Extension -in @('.zip', '.network', '.trace', '.har') -or $file.Name -match '(?i)(trace|network)') {
                Remove-Item -LiteralPath $file.FullName -Force
              }
            }
          }
      - name: Upload sanitized local E2E diagnostics (no traces or network captures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-authenticated-e2e-diagnostics
          path: |
            artifacts/*.log
            frontend/test-results/
            frontend/playwright-report/
            !frontend/test-results/**/*.zip
            !frontend/test-results/**/*trace*
            !frontend/test-results/**/*network*
            !frontend/playwright-report/**/*.zip
            !frontend/playwright-report/**/*trace*
            !frontend/playwright-report/**/*network*
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop isolated Supabase stack
        if: always()
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
        run: supabase stop --no-backup
  verify-migrations:
    name: Require latest Supabase migration applied
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Wait for remote migration history to converge
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN) -or [string]::IsNullOrWhiteSpace($env:SUPABASE_PROJECT_REF) -or [string]::IsNullOrWhiteSpace($env:SUPABASE_DB_PASSWORD)) {
            throw 'Production deploy is blocked: configure SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD in GitHub Actions secrets.'
          }
          .\ops\verify-supabase-migrations.ps1 -ProjectRef $env:SUPABASE_PROJECT_REF
  deploy-production:
    name: Deploy production (Cloud Run → Vercel)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs:
      [
        backend,
        frontend,
        database-security,
        e2e,
        local-authenticated-e2e,
        verify-migrations,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate Google Cloud with Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Redeploy backend to Cloud Run
        id: cloud-run
        shell: pwsh
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: southamerica-east1
          CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GCP_PROJECT_ID) -or
              [string]::IsNullOrWhiteSpace($env:CLOUD_RUN_SERVICE)) {
            throw 'Configure GCP_PROJECT_ID and CLOUD_RUN_SERVICE in GitHub Actions secrets.'
          }
          # Refuse to create an unexpected Cloud Run service when the target name is wrong.
          $existingService = gcloud run services describe $env:CLOUD_RUN_SERVICE --project $env:GCP_PROJECT_ID --region $env:GCP_REGION --format="value(metadata.name)" 2>$null
          if ([string]::IsNullOrWhiteSpace($existingService)) {
            throw "Cloud Run service '$($env:CLOUD_RUN_SERVICE)' was not found in $($env:GCP_PROJECT_ID)/$($env:GCP_REGION). Refusing to create a new service."
          }
          gcloud run deploy $env:CLOUD_RUN_SERVICE `
            --source backend `
            --project $env:GCP_PROJECT_ID `
            --region $env:GCP_REGION `
            --no-use-http2 `
            --timeout 3600 `
            --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Cloud Run deploy failed with exit code $LASTEXITCODE."
          }
          $serviceInfo = gcloud run services describe $env:CLOUD_RUN_SERVICE --project $env:GCP_PROJECT_ID --region $env:GCP_REGION --format=json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read the deployed Cloud Run service metadata.'
          }
          $serviceUrl = $serviceInfo.status.url
          $revision = $serviceInfo.status.latestReadyRevisionName
          if ([string]::IsNullOrWhiteSpace($serviceUrl) -or [string]::IsNullOrWhiteSpace($revision)) {
            throw 'Cloud Run did not report a ready revision and service URL after deployment.'
          }
          "service_url=$serviceUrl" >> $env:GITHUB_OUTPUT
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Verify Cloud Run health
        id: verify-cloud-run
        shell: pwsh
        env:
          BACKEND_URL: ${{ steps.cloud-run.outputs.service_url }}
        run: |
          $response = Invoke-WebRequest -Uri "$env:BACKEND_URL/health" -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            throw "Cloud Run health returned HTTP $($response.StatusCode)."
          }
          $payload = $response.Content | ConvertFrom-Json
          if ($payload.status -ne 'ok') {
            throw "Unexpected Cloud Run health payload: $($response.Content)"
          }
          "http_status=$($response.StatusCode)" >> $env:GITHUB_OUTPUT

      - name: Install Vercel CLI
        shell: pwsh
        run: npm install --global vercel@48.1.2

      - name: Build and publish frontend to Vercel
        id: deploy-vercel
        shell: pwsh
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VERCEL_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:VERCEL_ORG_ID) -or
              [string]::IsNullOrWhiteSpace($env:VERCEL_PROJECT_ID)) {
            throw 'Configure VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in GitHub Actions secrets.'
          }
          # Recreate the local Vercel link from the protected project identifiers.
          # A stale .vercel directory can point at a deleted or different project.
          if (Test-Path -LiteralPath '.vercel') {
            Remove-Item -LiteralPath '.vercel' -Recurse -Force
          }
          vercel link --yes --project $env:VERCEL_PROJECT_ID --scope $env:VERCEL_ORG_ID --token $env:VERCEL_TOKEN
          vercel pull --yes --environment=production --token $env:VERCEL_TOKEN
          # Let Vercel build remotely to avoid local shell/runtime differences in CI
          $deployOutput = vercel deploy --prod --yes --token $env:VERCEL_TOKEN 2>&1
          $deployExitCode = $LASTEXITCODE
          $deployOutput | ForEach-Object { Write-Host $_ }
          if ($deployExitCode -ne 0) {
            throw "Vercel production deployment failed with exit code $deployExitCode."
          }
          $urls = [regex]::Matches(($deployOutput -join [Environment]::NewLine), 'https://[a-zA-Z0-9.-]+\.vercel\.app')
          if ($urls.Count -eq 0) {
            throw 'Vercel CLI succeeded but did not return a deployment URL.'
          }
          "deployment_url=$($urls[$urls.Count - 1].Value)" >> $env:GITHUB_OUTPUT

      - name: Verify Vercel production URL
        id: verify-vercel
        shell: pwsh
        env:
          FRONTEND_URL: https://maismorras.vercel.app
        run: |
          $response = Invoke-WebRequest -Uri $env:FRONTEND_URL -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            throw "Vercel production URL returned HTTP $($response.StatusCode)."
          }
          "http_status=$($response.StatusCode)" >> $env:GITHUB_OUTPUT

      - name: Add deployment summary
        if: always()
        shell: pwsh
        env:
          CLOUD_RUN_OUTCOME: ${{ steps.cloud-run.outcome }}
          CLOUD_RUN_URL: ${{ steps.cloud-run.outputs.service_url }}
          CLOUD_RUN_REVISION: ${{ steps.cloud-run.outputs.revision }}
          CLOUD_RUN_HEALTH: ${{ steps.verify-cloud-run.outputs.http_status }}
          VERCEL_OUTCOME: ${{ steps.deploy-vercel.outcome }}
          VERCEL_DEPLOYMENT_URL: ${{ steps.deploy-vercel.outputs.deployment_url }}
          VERCEL_HEALTH: ${{ steps.verify-vercel.outputs.http_status }}
          COMMIT_SHA: ${{ github.sha }}
          E2E_STATUS: ${{ needs.e2e.outputs.e2e_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $summary = @"
          ## Produção — resumo do deploy

          | Serviço | Resultado | URL | Revisão / health |
          | --- | --- | --- | --- |
          | Cloud Run | $env:CLOUD_RUN_OUTCOME | $env:CLOUD_RUN_URL | $env:CLOUD_RUN_REVISION / HTTP $env:CLOUD_RUN_HEALTH |
          | Vercel | $env:VERCEL_OUTCOME | $env:VERCEL_DEPLOYMENT_URL | produção: https://maismorras.vercel.app / HTTP $env:VERCEL_HEALTH |

          Authenticated E2E: **$env:E2E_STATUS**

          Commit: $env:COMMIT_SHA
          [Execução completa do workflow]($env:RUN_URL)
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publish deploy status to commit
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLOUD_RUN_OUTCOME: ${{ steps.cloud-run.outcome }}
          CLOUD_RUN_HEALTH: ${{ steps.verify-cloud-run.outputs.http_status }}
          VERCEL_OUTCOME: ${{ steps.deploy-vercel.outcome }}
          VERCEL_HEALTH: ${{ steps.verify-vercel.outputs.http_status }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $endpoint = "https://api.github.com/repos/$env:GH_REPOSITORY/statuses/$env:COMMIT_SHA"
          $checks = @(
            @{ context = 'deploy/cloud-run'; outcome = $env:CLOUD_RUN_OUTCOME; health = $env:CLOUD_RUN_HEALTH },
            @{ context = 'deploy/vercel'; outcome = $env:VERCEL_OUTCOME; health = $env:VERCEL_HEALTH }
          )
          foreach ($check in $checks) {
            $success = $check.outcome -eq 'success' -and $check.health -eq '200'
            $state = if ($success) { 'success' } else { 'failure' }
            $description = if ($success) { "Deploy e health check OK (HTTP $($check.health))" } else { "Deploy/health check falhou (etapa: $($check.outcome), HTTP $($check.health))" }
            $body = @{ state = $state; context = $check.context; description = $description; target_url = $env:RUN_URL } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri $endpoint -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
          }
