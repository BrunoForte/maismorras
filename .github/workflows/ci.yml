name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: node scripts/check-migration-prefixes.mjs
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: govulncheck ./...
      - run: go build ./cmd/api
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build

  database-security:
    name: Supabase migrations and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
  e2e:
    name: E2E authenticated (optional)
    outputs:
      e2e_status: ${{ steps.configure-auth-state.outputs.result == 'skipped' && 'skipped' || steps.run-e2e.outcome }}
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://maismorras.vercel.app' }}
      E2E_STORAGE_STATE_B64: ${{ secrets.E2E_STORAGE_STATE_B64 }}
      E2E_SCENE_URL: ${{ vars.E2E_SCENE_URL }}
      E2E_PLAYER_STORAGE_STATE_B64: ${{ secrets.E2E_PLAYER_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Configure authenticated storage state
        id: configure-auth-state
        shell: pwsh
        working-directory: frontend
        run: |
          if ([string]::IsNullOrWhiteSpace($env:E2E_STORAGE_STATE_B64)) {
            "E2E_STORAGE_STATE_B64 not configured; skipping authenticated E2E." | Out-File e2e-skip.txt
            "result=skipped" >> $env:GITHUB_OUTPUT
            exit 0
          }
          [IO.File]::WriteAllBytes('e2e-storage-state.json', [Convert]::FromBase64String($env:E2E_STORAGE_STATE_B64))
          "result=configured" >> $env:GITHUB_OUTPUT
          $env:E2E_STORAGE_STATE = (Join-Path (Get-Location) 'e2e-storage-state.json')
          "E2E_STORAGE_STATE=$env:E2E_STORAGE_STATE" | Out-File $env:GITHUB_ENV -Append
          if (-not [string]::IsNullOrWhiteSpace($env:E2E_PLAYER_STORAGE_STATE_B64)) {
            [IO.File]::WriteAllBytes('e2e-player-storage-state.json', [Convert]::FromBase64String($env:E2E_PLAYER_STORAGE_STATE_B64))
            "E2E_PLAYER_STORAGE_STATE=$(Join-Path (Get-Location) 'e2e-player-storage-state.json')" | Out-File $env:GITHUB_ENV -Append
          }
      - name: Run Playwright E2E
        id: run-e2e
        shell: pwsh
        working-directory: frontend
        run: |
          if (Test-Path e2e-skip.txt) { Write-Host 'Authenticated E2E skipped.'; exit 0 }
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Remove session state
        if: always()
        shell: pwsh
        working-directory: frontend
        run: Remove-Item -Force -ErrorAction SilentlyContinue e2e-storage-state.json, e2e-player-storage-state.json
      - name: Report authenticated E2E status
        if: always()
        shell: pwsh
        env:
          E2E_CONFIGURED: ${{ steps.configure-auth-state.outputs.result }}
          E2E_OUTCOME: ${{ steps.run-e2e.outcome }}
        run: |
          if ($env:E2E_CONFIGURED -eq 'skipped') {
            "### Authenticated E2E: SKIPPED`n`n`E2E_STORAGE_STATE_B64` is not configured; no authenticated browser tests ran." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "### Authenticated E2E: $($env:E2E_OUTCOME.ToUpperInvariant())" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
  verify-migrations:
    name: Require latest Supabase migration applied
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Wait for remote migration history to converge
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN) -or [string]::IsNullOrWhiteSpace($env:SUPABASE_PROJECT_REF) -or [string]::IsNullOrWhiteSpace($env:SUPABASE_DB_PASSWORD)) {
            throw 'Production deploy is blocked: configure SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD in GitHub Actions secrets.'
          }
          .\ops\verify-supabase-migrations.ps1 -ProjectRef $env:SUPABASE_PROJECT_REF
  deploy-production:
    name: Deploy production (Cloud Run → Vercel)
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend, database-security, e2e, verify-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      statuses: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authenticate Google Cloud with Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Redeploy backend to Cloud Run
        id: cloud-run
        shell: pwsh
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: southamerica-east1
          CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GCP_PROJECT_ID) -or
              [string]::IsNullOrWhiteSpace($env:CLOUD_RUN_SERVICE)) {
            throw 'Configure GCP_PROJECT_ID and CLOUD_RUN_SERVICE in GitHub Actions secrets.'
          }
          # Refuse to create an unexpected Cloud Run service when the target name is wrong.
          $existingService = gcloud run services describe $env:CLOUD_RUN_SERVICE --project $env:GCP_PROJECT_ID --region $env:GCP_REGION --format="value(metadata.name)" 2>$null
          if ([string]::IsNullOrWhiteSpace($existingService)) {
            throw "Cloud Run service '$($env:CLOUD_RUN_SERVICE)' was not found in $($env:GCP_PROJECT_ID)/$($env:GCP_REGION). Refusing to create a new service."
          }
          gcloud run deploy $env:CLOUD_RUN_SERVICE `
            --source backend `
            --project $env:GCP_PROJECT_ID `
            --region $env:GCP_REGION `
            --no-use-http2 `
            --timeout 3600 `
            --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Cloud Run deploy failed with exit code $LASTEXITCODE."
          }
          $serviceInfo = gcloud run services describe $env:CLOUD_RUN_SERVICE --project $env:GCP_PROJECT_ID --region $env:GCP_REGION --format=json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not read the deployed Cloud Run service metadata.'
          }
          $serviceUrl = $serviceInfo.status.url
          $revision = $serviceInfo.status.latestReadyRevisionName
          if ([string]::IsNullOrWhiteSpace($serviceUrl) -or [string]::IsNullOrWhiteSpace($revision)) {
            throw 'Cloud Run did not report a ready revision and service URL after deployment.'
          }
          "service_url=$serviceUrl" >> $env:GITHUB_OUTPUT
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Verify Cloud Run health
        id: verify-cloud-run
        shell: pwsh
        env:
          BACKEND_URL: ${{ steps.cloud-run.outputs.service_url }}
        run: |
          $response = Invoke-WebRequest -Uri "$env:BACKEND_URL/health" -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            throw "Cloud Run health returned HTTP $($response.StatusCode)."
          }
          $payload = $response.Content | ConvertFrom-Json
          if ($payload.status -ne 'ok') {
            throw "Unexpected Cloud Run health payload: $($response.Content)"
          }
          "http_status=$($response.StatusCode)" >> $env:GITHUB_OUTPUT

      - name: Install Vercel CLI
        shell: pwsh
        run: npm install --global vercel@48.1.2

      - name: Build and publish frontend to Vercel
        id: deploy-vercel
        shell: pwsh
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VERCEL_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:VERCEL_ORG_ID) -or
              [string]::IsNullOrWhiteSpace($env:VERCEL_PROJECT_ID)) {
            throw 'Configure VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in GitHub Actions secrets.'
          }
          # Recreate the local Vercel link from the protected project identifiers.
          # A stale .vercel directory can point at a deleted or different project.
          if (Test-Path -LiteralPath '.vercel') {
            Remove-Item -LiteralPath '.vercel' -Recurse -Force
          }
          vercel link --yes --project $env:VERCEL_PROJECT_ID --scope $env:VERCEL_ORG_ID --token $env:VERCEL_TOKEN
          vercel pull --yes --environment=production --token $env:VERCEL_TOKEN
          # Let Vercel build remotely to avoid local shell/runtime differences in CI
          $deployOutput = vercel deploy --prod --yes --token $env:VERCEL_TOKEN 2>&1
          $deployExitCode = $LASTEXITCODE
          $deployOutput | ForEach-Object { Write-Host $_ }
          if ($deployExitCode -ne 0) {
            throw "Vercel production deployment failed with exit code $deployExitCode."
          }
          $urls = [regex]::Matches(($deployOutput -join [Environment]::NewLine), 'https://[a-zA-Z0-9.-]+\.vercel\.app')
          if ($urls.Count -eq 0) {
            throw 'Vercel CLI succeeded but did not return a deployment URL.'
          }
          "deployment_url=$($urls[$urls.Count - 1].Value)" >> $env:GITHUB_OUTPUT

      - name: Verify Vercel production URL
        id: verify-vercel
        shell: pwsh
        env:
          FRONTEND_URL: https://maismorras.vercel.app
        run: |
          $response = Invoke-WebRequest -Uri $env:FRONTEND_URL -UseBasicParsing
          if ($response.StatusCode -ne 200) {
            throw "Vercel production URL returned HTTP $($response.StatusCode)."
          }
          "http_status=$($response.StatusCode)" >> $env:GITHUB_OUTPUT

      - name: Add deployment summary
        if: always()
        shell: pwsh
        env:
          CLOUD_RUN_OUTCOME: ${{ steps.cloud-run.outcome }}
          CLOUD_RUN_URL: ${{ steps.cloud-run.outputs.service_url }}
          CLOUD_RUN_REVISION: ${{ steps.cloud-run.outputs.revision }}
          CLOUD_RUN_HEALTH: ${{ steps.verify-cloud-run.outputs.http_status }}
          VERCEL_OUTCOME: ${{ steps.deploy-vercel.outcome }}
          VERCEL_DEPLOYMENT_URL: ${{ steps.deploy-vercel.outputs.deployment_url }}
          VERCEL_HEALTH: ${{ steps.verify-vercel.outputs.http_status }}
          COMMIT_SHA: ${{ github.sha }}
          E2E_STATUS: ${{ needs.e2e.outputs.e2e_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $summary = @"
          ## Produção — resumo do deploy

          | Serviço | Resultado | URL | Revisão / health |
          | --- | --- | --- | --- |
          | Cloud Run | $env:CLOUD_RUN_OUTCOME | $env:CLOUD_RUN_URL | $env:CLOUD_RUN_REVISION / HTTP $env:CLOUD_RUN_HEALTH |
          | Vercel | $env:VERCEL_OUTCOME | $env:VERCEL_DEPLOYMENT_URL | produção: https://maismorras.vercel.app / HTTP $env:VERCEL_HEALTH |

          Authenticated E2E: **$env:E2E_STATUS**

          Commit: $env:COMMIT_SHA
          [Execução completa do workflow]($env:RUN_URL)
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publish deploy status to commit
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLOUD_RUN_OUTCOME: ${{ steps.cloud-run.outcome }}
          CLOUD_RUN_HEALTH: ${{ steps.verify-cloud-run.outputs.http_status }}
          VERCEL_OUTCOME: ${{ steps.deploy-vercel.outcome }}
          VERCEL_HEALTH: ${{ steps.verify-vercel.outputs.http_status }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $endpoint = "https://api.github.com/repos/$env:GH_REPOSITORY/statuses/$env:COMMIT_SHA"
          $checks = @(
            @{ context = 'deploy/cloud-run'; outcome = $env:CLOUD_RUN_OUTCOME; health = $env:CLOUD_RUN_HEALTH },
            @{ context = 'deploy/vercel'; outcome = $env:VERCEL_OUTCOME; health = $env:VERCEL_HEALTH }
          )
          foreach ($check in $checks) {
            $success = $check.outcome -eq 'success' -and $check.health -eq '200'
            $state = if ($success) { 'success' } else { 'failure' }
            $description = if ($success) { "Deploy e health check OK (HTTP $($check.health))" } else { "Deploy/health check falhou (etapa: $($check.outcome), HTTP $($check.health))" }
            $body = @{ state = $state; context = $check.context; description = $description; target_url = $env:RUN_URL } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri $endpoint -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
          }
